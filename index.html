<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canh tac hao quang</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none}
#wrap{position:relative;width:600px;height:800px;max-width:100vw;max-height:100vh}
canvas{width:600px;height:800px;max-width:100vw;max-height:100vh;display:block;image-rendering:auto}
.controls{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:space-between;padding:0 25px;pointer-events:none}
button{width:105px;height:105px;border:3px solid rgba(255,255,255,.8);border-radius:22px;background:rgba(0,0,0,.5);color:#fff;font-size:58px;font-family:Arial,sans-serif;line-height:1;pointer-events:auto;user-select:none;-webkit-user-select:none}
button:active{background:rgba(255,255,255,.35)}#restartBtn{display:none;position:absolute;right:25px;top:25px}
@media(max-width:700px){
#wrap{width:100vw;height:100vh}
canvas{width:100vw;height:100vh}
.controls{bottom:15px;padding:0 15px}
button{width:82px;height:82px;font-size:45px}
}
@media(min-width:701px){
.controls{display:flex}
}
@media(min-width:1000px) and (min-height:700px){
button{width:120px;height:120px;font-size:65px}
.controls{bottom:25px;padding:0 30px}
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="600" height="800"></canvas>
<div class="controls">
<button id="leftBtn" aria-label="Trái">◀</button>
<button id="rightBtn" aria-label="Phải">▶</button><button id="restartBtn" aria-label="Chơi lại">↻</button>
</div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const car=new Image(),enemy=new Image(),emoji=new Image();
car.src="assets/car.png";
enemy.src="assets/enemy.png";
emoji.src="assets/emoji.png";
const TRACKS=["assets/music1.mp3","assets/music2.mp3","assets/music3.mp3"];
const BASE_VOLUME=0.5;
const FADE_SECONDS=2;
let trackIndex=0;
const audio=new Audio(TRACKS[trackIndex]);
audio.loop=false;
audio.volume=BASE_VOLUME;
audio.addEventListener("timeupdate",()=>{
    if(isNaN(audio.duration))return;
    const remaining=audio.duration-audio.currentTime;
    if(remaining<=FADE_SECONDS){
        audio.volume=Math.max(0,BASE_VOLUME*(remaining/FADE_SECONDS));
    }else if(audio.volume!==BASE_VOLUME){
        audio.volume=BASE_VOLUME;
    }
});
audio.addEventListener("ended",()=>{
    trackIndex=(trackIndex+1)%TRACKS.length;
    audio.src=TRACKS[trackIndex];
    audio.volume=BASE_VOLUME;
    audio.play().catch(()=>{});
});
const WIDTH=600,HEIGHT=800;
const GREEN="rgb(30,150,50)",GRAY="rgb(70,70,70)",WHITE="#fff";
let carX=275,carY=650,carSpeed=7;
const lanes=[130,230,330,430];
let enemies=[];
let enemySpeed=3.260;
let spawnDelay=0.625;
let spawnTimer=0;
let score=0;
let lineY=0;
const SAFE_FRAMES=15;
let running=true;
let lastTime=performance.now();
function spawnEnemy(){
    const dangerLanes=new Set();
    for(const lane of lanes){
        for(const e of enemies){
            if(e.x===lane){
                const futureY=e.y+e.speed*SAFE_FRAMES;
                if(futureY+90>=carY-15&&e.y<=carY+90+15){
                    dangerLanes.add(lane);
                    break;
                }
            }
        }
    }
    let safeLanes=lanes.filter(lane=>!dangerLanes.has(lane));
    if(!safeLanes.length)safeLanes=lanes.filter(lane=>lane!==carX);
    if(!safeLanes.length)safeLanes=lanes.slice();
    const weights=safeLanes.map(lane=>1+Math.abs(lane-carX)/100);
    const total=weights.reduce((a,b)=>a+b,0);
    let r=Math.random()*total;
    let x=safeLanes[safeLanes.length-1];
    for(let i=0;i<safeLanes.length;i++){
        r-=weights[i];
        if(r<=0){
            x=safeLanes[i];
            break;
        }
    }
    const validY=[];
    for(let i=0;i<60;i++){
        const y=Math.floor(Math.random()*531)-650;
        let valid=true;
        for(const e of enemies){
            if(e.x===x){
                const gap=Math.abs(y-e.y);
                const requiredGap=90+e.speed*SAFE_FRAMES;
                if(gap<requiredGap){
                    valid=false;
                    break;
                }
            }
        }
        if(valid)validY.push(y);
    }
    if(validY.length){
        const y=validY[Math.floor(Math.random()*validY.length)];
        enemies.push({x,y,speed:enemySpeed});
    }
}
function rectsCollide(a,b){
    return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function update(dt){
    if(!running)return;
    spawnTimer+=dt;
    while(spawnTimer>=spawnDelay){
        spawnTimer-=spawnDelay;
        spawnEnemy();
    }
    for(const e of enemies)e.y+=e.speed;
    for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i];
        if(e.y>HEIGHT){
            enemies.splice(i,1);
            score++;
            if(score%100===0){
                if(spawnDelay>0.025){
                    spawnDelay=Math.max(0.025,spawnDelay-0.025);
                }else{
                    enemySpeed+=0.25;
                    for(const other of enemies)other.speed=enemySpeed;
                }
            }
        }
    }
    const player={x:carX,y:carY,w:50,h:90};
    for(const e of enemies){
        if(rectsCollide(player,{x:e.x,y:e.y,w:50,h:90})){
            running=false;
            break;
        }
    }
    lineY=(lineY+enemySpeed)%80;
}
function draw(){
    ctx.fillStyle=GREEN;
    ctx.fillRect(0,0,WIDTH,HEIGHT);
    ctx.fillStyle=GRAY;
    ctx.fillRect(100,0,400,800);
    ctx.fillStyle=WHITE;
    ctx.fillRect(100,0,5,800);
    ctx.fillRect(495,0,5,800);
    for(let y=-40;y<800;y+=80)ctx.fillRect(295,y+lineY,10,40);
    if(car.complete&&car.naturalWidth)ctx.drawImage(car,carX,carY,50,90);
    else{
        ctx.fillStyle="#222";
        ctx.fillRect(carX,carY,50,90);
    }
    for(const e of enemies){
        if(enemy.complete&&enemy.naturalWidth)ctx.drawImage(enemy,e.x,e.y,50,90);
        else{
            ctx.fillStyle="#900";
            ctx.fillRect(e.x,e.y,50,90);
        }
    }
    ctx.font="40px Comic Sans MS,Comic Sans,sans-serif";
    const text=`Bá khí: ${score}`;
    const textWidth=ctx.measureText(text).width;
    ctx.textAlign="left";
    ctx.lineWidth=2;
    ctx.strokeStyle=WHITE;
    ctx.strokeText(text,20,60);
    ctx.fillStyle="#000";
    ctx.fillText(text,20,60);
    if(emoji.complete&&emoji.naturalWidth)ctx.drawImage(emoji,20+textWidth-15,0,90,90);
    document.getElementById("restartBtn").style.display=running?"none":"block";
    if(!running){
        ctx.fillStyle="rgba(0,0,0,.55)";
        ctx.fillRect(0,0,WIDTH,HEIGHT);
        ctx.fillStyle=WHITE;
        ctx.textAlign="center";
        ctx.font="55px Comic Sans MS,Comic Sans,sans-serif";
        ctx.fillText("GAME OVER",WIDTH/2,HEIGHT/2);
        ctx.font="25px Comic Sans MS,Comic Sans,sans-serif";
        ctx.fillText("Nhấn R để chơi lại",WIDTH/2,HEIGHT/2+50);
    }
}
function loop(now){
    const dt=Math.min((now-lastTime)/1000,0.1);
    lastTime=now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
function moveLeft(){
    if(running)carX-=100;
    carX=Math.max(130,Math.min(carX,430));
    if(audio.paused)audio.play().catch(()=>{});
}
function moveRight(){
    if(running)carX+=100;
    carX=Math.max(130,Math.min(carX,430));
    if(audio.paused)audio.play().catch(()=>{});
}
document.addEventListener("keydown",e=>{
    if(e.key==="a"||e.key==="A"||e.key==="ArrowLeft")moveLeft();
    if(e.key==="d"||e.key==="D"||e.key==="ArrowRight")moveRight();
    if(e.key==="r"||e.key==="R"){
        if(!running)location.reload();
    }
});
function bindButton(button,action){
    button.addEventListener("pointerdown",e=>{
        e.preventDefault();
        action();
    });
}
bindButton(document.getElementById("leftBtn"),moveLeft);
bindButton(document.getElementById("rightBtn"),moveRight);
function restartGame(){if(!running)location.reload();}
bindButton(document.getElementById("restartBtn"),restartGame);
canvas.addEventListener("pointerdown",()=>{
    audio.play().catch(()=>{});
});
requestAnimationFrame(loop);
</script>
</body>
</html>
